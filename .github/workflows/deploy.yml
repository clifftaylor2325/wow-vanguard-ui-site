# Publishes the site to Cloudflare Pages (project vanguard-ui: vanguardui.com, vanguard-ui.pages.dev). It runs only
# when started by hand: Actions tab → deploy → Run workflow (feedback-setup.yml runs it too). It
# builds and checks the site exactly as check.yml does, so a deploy never goes out with a failing
# check, creates the Pages project the first time, then uploads dist/ together with functions/ (the
# feedback form's Function).
#
# Secrets it needs (Settings → Secrets and variables → Actions):
#   ADDON_READ_TOKEN       read-only token for the private addon repo (the same one check.yml uses)
#   CLOUDFLARE_API_TOKEN   a Cloudflare API token with the "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  the Cloudflare account id (dashboard → Workers & Pages, right-hand column)
# The feedback form's own secrets and bindings are set on the Pages project itself; see README.md.
name: deploy

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Secrets
        env:
          ADDON: ${{ secrets.ADDON_READ_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$ADDON" ] || missing="$missing ADDON_READ_TOKEN"
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the comment at the top of .github/workflows/deploy.yml."
            exit 1
          fi

      - run: npm ci

      - run: npm run check
        env:
          GH_TOKEN: ${{ secrets.ADDON_READ_TOKEN }}

      - name: Create the Pages project the first time
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw vanguard-ui; then
            echo "Pages project vanguard-ui exists."
          else
            npx --yes wrangler@4 pages project create vanguard-ui --production-branch main
          fi

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name vanguard-ui --branch main --commit-dirty=true
