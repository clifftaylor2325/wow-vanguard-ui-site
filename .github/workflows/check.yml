# Builds the site and runs every check (encoding, drift and page tests) on pull
# requests, on every push to main, or by hand from the Actions tab. It never deploys and never pushes.
# The build reads the addon repo (clifftaylor2325/wow-vanguard-ui) through gh.
# That repo is public, so the run's own GITHUB_TOKEN is enough, for pull
# requests from forks too.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check
        env:
          GH_TOKEN: ${{ github.token }}
